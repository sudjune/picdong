<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>picdong</title>
  <style>
    /* 리셋 및 기본 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fafafa;
      color: #222;
      -webkit-tap-highlight-color: transparent;
    }

    /* 상단바 네비게이션 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background-color: #fff;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 8px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 화면을 덮던 거대 로고 크기 고정 */
    .logo-area img, .brand-logo, header img {
      width: 32px !important;
      height: 32px !important;
      border-radius: 50% !important;
      object-fit: cover !important;
      display: block !important;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .btn {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: #000;
      color: #fff;
    }

    .btn-secondary {
      background-color: #f1f2f4;
      color: #333;
    }

    /* 닉네임 뱃지 찌그러짐 방지 */
    .user-info {
      font-size: 11px;
      font-weight: 700;
      background-color: #eef4ff;
      color: #2b6cb0;
      padding: 4px 7px;
      border-radius: 12px;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
      line-height: 1.2;
    }

    /* 메인 피드 컨테이너 */
    .container {
      max-width: 540px;
      margin: 14px auto 60px;
      padding: 0 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 2px;
    }

    .section-header h2 {
      font-size: 16px;
      font-weight: 700;
    }

    #postCount {
      font-size: 12px;
      color: #888;
    }

    .feed-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 사진 카드 */
    .card {
      background: #fff;
      border: 1px solid #ececec;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .card img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 12px 14px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #666;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: #fff;
      border: 1px solid #e2e2e2;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }

    .delete-btn {
      background: #fff0f0;
      color: #e53e3e;
      border: 1px solid #fed7d7;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
    }

    .empty-msg {
      text-align: center;
      padding: 40px 0;
      color: #999;
      font-size: 14px;
    }

    /* 팝업 모달 (기본 숨김 필수) */
    .modal {
      display: none; /* 화면 바닥에 펼쳐지는 현상 차단 */
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-content {
      background: #fff;
      padding: 22px;
      border-radius: 14px;
      width: 100%;
      max-width: 320px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 22px;
      color: #888;
      cursor: pointer;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    .full-width {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      font-size: 14px;
    }

    .auth-toggle {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
    }

    .auth-toggle a {
      color: #000;
      font-weight: 700;
      margin-left: 4px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <header class="header">
    <div class="logo-area" onclick="location.reload()">
      <img src="/pageicon.png" alt="logo" class="brand-logo">
      <span class="brand-name">picdong</span>
    </div>
    <div class="nav-buttons">
      <button id="rankingTabBtn" class="btn btn-secondary">🏆 랭킹</button>
      <span id="userInfo" class="user-info" style="display: none;"></span>
      <button id="authBtn" class="btn btn-secondary">로그인 / 회원가입</button>
      <button id="logoutBtn" class="btn btn-secondary" style="display: none;">로그아웃</button>
      <button id="uploadBtn" class="btn btn-primary">+ 사진 올리기</button>
    </div>
  </header>

  <!-- 본문 피드 -->
  <main class="container">
    <div class="section-header">
      <h2 id="sectionTitle">최신 피드</h2>
      <span id="postCount">0장</span>
    </div>
    <div id="feedList" class="feed-grid">
      <p class="empty-msg">불러오는 중...</p>
    </div>
  </main>

  <!-- 로그인/회원가입 모달 -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeAuthModal">&times;</span>
      <h3 id="modalTitle">로그인</h3>
      <input type="text" id="authUsername" placeholder="아이디" class="input-field">
      <input type="password" id="authPassword" placeholder="비밀번호" class="input-field">
      <button id="submitAuthBtn" class="btn btn-primary full-width">확인</button>
      <div class="auth-toggle">
        <span id="toggleAuthText">계정이 없으신가요?</span>
        <a href="#" id="toggleAuthMode">회원가입</a>
      </div>
    </div>
  </div>

  <!-- 사진 업로드 모달 -->
  <div id="uploadModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeUploadModal">&times;</span>
      <h3>새 사진 업로드</h3>
      <input type="text" id="uploadTitle" placeholder="사진 제목을 입력하세요" class="input-field">
      <input type="file" id="uploadFile" accept="image/*" class="input-field">
      <button id="submitUploadBtn" class="btn btn-primary full-width">게시하기</button>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
